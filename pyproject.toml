[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motiflow"
version = "0.1.0"
description = "3D Molecule Generation from Rigid Motifs via SE(3) Flows"
requires-python = ">=3.10,<3.12"
authors = [
    { name = "Roman Poletukhin" }
]
dependencies = [
    "torch>=2.1,<3",
    "torch_geometric>=2.5,<3",
    "rdkit>=2023.9",
    "pandas>=2,<3",
    "numpy>=1.24,<2",
    "tqdm>=4.66,<5",
    "pyyaml>=6,<7",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "ase>=3.22,<4",
    "einops>=0.7,<1",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1",
]
tracking = [
    "wandb>=0.23,<0.24",
]
visualization = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "plotly>=5,<7",
]

[tool.setuptools.packages.find]
include = ["motiflow", "motiflow.*"]

[tool.setuptools.package-data]
"motiflow.data" = ["manifests/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Preserve upstream implementations unless a scientific change requires touching them.
"motiflow/utils/condflowmatcher.py" = ["E501"]
"motiflow/utils/rigid_utils.py" = ["E721", "E731"]
